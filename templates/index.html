<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-like Player</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Spotifaux</h2>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search for a song...">
                <button id="searchBtn">Search</button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </aside>

        <!-- Main Content (Lyrics) -->
        <main class="main-content">
            <div class="header">
                <h1 id="currentSongTitle">Welcome</h1>
                <p id="currentSongArtist">Search and play a song to view lyrics</p>
            </div>
            
            <div class="lyrics-container">
                <div id="lyricsContent" class="lyrics-content">
                    <p class="placeholder-text">Lyrics will appear here</p>
                </div>
            </div>
        </main>

        <!-- Bottom Player Bar -->
        <footer class="player-bar">
            <div class="player-info">
                <img id="playerThumbnail" src="" alt="Thumbnail" style="display: none;">
                <div class="player-details">
                    <span id="playerTitle">No track selected</span>
                </div>
            </div>
            
            <div class="player-controls">
                <div class="buttons">
                    <button id="playPauseBtn" disabled>▶</button>
                </div>
                <div class="progress-container">
                    <span id="currentTime">0:00</span>
                    <input type="range" id="progressBar" value="0" min="0" step="1" disabled>
                    <span id="durationTime">0:00</span>
                </div>
            </div>
            
            <div class="player-actions">
                <button id="downloadBtn" disabled>Download</button>
            </div>
        </footer>
    </div>
    <audio id="audioPlayer" style="display:none;"></audio>
    <script src="/static/app.js"></script>
</body>
</html>
